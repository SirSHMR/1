<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
</head>
<body>
    <h2>Login</h2>
    <input type="text" id="username_password" placeholder="Enter username and password (e.g., admin:12345)">
    <button onclick="checkLogin()">Login</button>
    <p id="error" style="color: red; display: none;">Incorrect username or password</p>

    <script>
        function checkLogin() {
            var correctUsernamePassword = "admin:12345"; // Correct combined username and password

            var enteredUsernamePassword = document.getElementById("username_password").value;

            if (enteredUsernamePassword === correctUsernamePassword) {
                alert("Login successful!");
            } else {
                document.getElementById("error").style.display = "block";
            }
        }
    </script>
</body>
</html>
